<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDB.PROD - Proposer un Thème</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --chat-bg: #0b141a;
      --header-bg: #202c33;
      --my-msg-bg: #005c4b;
      --other-msg-bg: #202c33;
      --input-bar-bg: #202c33;
      --text-color: #e9edef;
      --text-secondary: #8696a0;
      --accent-color: #00a884;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: #111b21;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* En-tête du Chat */
    .chat-header {
      background-color: var(--header-bg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a3942;
      z-index: 10;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #d32f2f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .header-text h2 { margin: 0; font-size: 1rem; }
    .header-text p { margin: 0; font-size: 0.75rem; color: var(--text-secondary); }
    .btn-back-link { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }

    /* Zone des Messages */
    .chat-messages {
      flex: 1;
      background-color: var(--chat-bg);
      background-image: radial-gradient(#202c33 1px, transparent 0);
      background-size: 24px 24px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      position: relative;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message-bubble.mine {
      align-self: flex-end;
      background-color: var(--my-msg-bg);
      border-top-right-radius: 0;
    }

    .message-bubble.other {
      align-self: flex-start;
      background-color: var(--other-msg-bg);
      border-top-left-radius: 0;
    }

    .msg-sender {
      font-size: 0.75rem;
      font-weight: bold;
      color: #e57373;
      margin-bottom: 2px;
    }

    .msg-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 0.68rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .edited-tag { font-style: italic; margin-right: 2px; }

    /* Actions sur les messages (Edit / Delete) */
    .msg-actions {
      display: none;
      position: absolute;
      top: 4px;
      right: 6px;
      background: rgba(0,0,0,0.6);
      border-radius: 4px;
      padding: 2px;
    }

    .message-bubble.mine:hover .msg-actions {
      display: flex;
      gap: 4px;
    }

    .btn-action {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 4px;
    }

    .btn-action:hover { color: #e53935; }

    /* Audio & Stickers */
    audio { max-width: 240px; height: 36px; margin-top: 4px; }
    .sticker-img { width: 120px; height: 120px; object-fit: contain; }

    /* Panneaux d'Emojis / Stickers */
    .popover-panel {
      display: none;
      background-color: var(--header-bg);
      border-top: 1px solid #2a3942;
      padding: 10px;
      max-height: 160px;
      overflow-y: auto;
    }

    .popover-panel.active { display: flex; flex-wrap: wrap; gap: 10px; }

    .emoji-item, .sticker-item {
      cursor: pointer;
      font-size: 1.4rem;
      transition: transform 0.1s;
    }

    .emoji-item:hover, .sticker-item:hover { transform: scale(1.2); }
    .sticker-item img { width: 45px; height: 45px; }

    /* Barre d'édition active */
    .edit-indicator {
      display: none;
      background-color: #182229;
      padding: 6px 16px;
      border-left: 4px solid var(--accent-color);
      font-size: 0.8rem;
      color: var(--text-secondary);
      justify-content: space-between;
      align-items: center;
    }

    .edit-indicator.active { display: flex; }

    .btn-cancel-edit {
      background: none;
      border: none;
      color: #e53935;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Barre d'écriture */
    .chat-input-bar {
      background-color: var(--input-bar-bg);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      background-color: #2a3942;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover { color: var(--text-color); }
    .btn-icon.recording { color: #e53935; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .btn-send {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modales Personnalisées (Pseudo & Confirmation) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #202c33;
      padding: 22px;
      border-radius: 12px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #2a3942;
    }

    .modal-box h3 { margin-top: 0; font-size: 1.1rem; }
    .modal-box p { font-size: 0.85rem; color: #8696a0; margin-bottom: 20px; }

    .modal-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #111b21;
      color: #fff;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-modal {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      flex: 1;
    }

    .btn-modal-primary { background: var(--accent-color); color: #fff; }
    .btn-modal-danger { background: #b71c1c; color: #fff; }
    .btn-modal-danger:hover { background: #d32f2f; }
    .btn-modal-cancel { background: #37474f; color: #ccc; }
  </style>
</head>
<body>

  <!-- Modal Pseudo -->
  <div id="username-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Bienvenue sur le Chat</h3>
      <p>Entrez votre pseudonyme pour participer :</p>
      <input type="text" id="username-input" placeholder="Votre prénom / pseudo..." maxlength="20">
      <div class="modal-actions">
        <button id="btn-save-username" class="btn-modal btn-modal-primary">Rejoindre</button>
      </div>
    </div>
  </div>

  <!-- Modal de Confirmation de Suppression -->
  <div id="delete-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Supprimer le message ?</h3>
      <p>Cette action est définitive et le message sera effacé pour tout le monde.</p>
      <div class="modal-actions">
        <button id="btn-cancel-delete" class="btn-modal btn-modal-cancel">Annuler</button>
        <button id="btn-confirm-delete" class="btn-modal btn-modal-danger">Supprimer</button>
      </div>
    </div>
  </div>

  <!-- En-tête du Chat -->
  <header class="chat-header">
    <div class="header-info">
      <a href="index.html" class="btn-back-link">← Retour</a>
      <div class="avatar">💡</div>
      <div class="header-text">
        <h2>Boîte à Idées - MDB.PROD</h2>
        <p>Proposez et discutez des prochains sujets</p>
      </div>
    </div>
  </header>

  <!-- Conteneur des Messages -->
  <main class="chat-messages" id="messages-container">
    <!-- Messages chargés dynamiquement -->
  </main>

  <!-- Panneaux Emojis & Stickers -->
  <div class="popover-panel" id="emoji-panel">
    <span class="emoji-item">🔥</span><span class="emoji-item">✨</span>
    <span class="emoji-item">💡</span><span class="emoji-item">🎯</span>
    <span class="emoji-item">🚀</span><span class="emoji-item">❤️</span>
    <span class="emoji-item">😂</span><span class="emoji-item">🤔</span>
    <span class="emoji-item">👏</span><span class="emoji-item">🎬</span>
    <span class="emoji-item">🎧</span><span class="emoji-item">💯</span>
  </div>

  <div class="popover-panel" id="sticker-panel">
    <div class="sticker-item" data-url="https://cdn-icons-png.flaticon.com/512/2278/2278992.png">
      <img src="https://cdn-icons-png.flaticon.com/512/2278/2278992.png" alt="Sticker 1">
    </div>
    <div class="sticker-item" data-url="https://cdn-icons-png.flaticon.com/512/415/415733.png">
      <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png" alt="Sticker 2">
    </div>
    <div class="sticker-item" data-url="https://cdn-icons-png.flaticon.com/512/1791/1791320.png">
      <img src="https://cdn-icons-png.flaticon.com/512/1791/1791320.png" alt="Sticker 3">
    </div>
  </div>

  <!-- Indicateur de modification de message -->
  <div class="edit-indicator" id="edit-indicator">
    <span>✏️ Modification du message...</span>
    <button class="btn-cancel-edit" id="btn-cancel-edit">Annuler</button>
  </div>

  <!-- Barre d'envoi -->
  <footer class="chat-input-bar">
    <button class="btn-icon" id="btn-toggle-emoji" title="Emojis">😊</button>
    <button class="btn-icon" id="btn-toggle-sticker" title="Stickers">🎨</button>
    <button class="btn-icon" id="btn-record-audio" title="Message vocal">🎙️</button>
    
    <input type="text" id="message-input" placeholder="Proposer un thème ou écrire un message..." autocomplete="off">
    
    <button class="btn-send" id="btn-send-message">
      <svg id="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
      getStorage, ref, uploadBytes, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbDMR-oyeJwNNL6TSIMfO8YTIjijvxays",
      authDomain: "coupdemain-2f67c.firebaseapp.com",
      databaseURL: "https://coupdemain-2f67c-default-rtdb.firebaseio.com",
      projectId: "coupdemain-2f67c",
      storageBucket: "coupdemain-2f67c.firebasestorage.app",
      messagingSenderId: "125578826567",
      appId: "1:125578826567:web:f74a319d0544f4ef2cf262",
      measurementId: "G-B5FCY22Y03"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    function getVisitorId() {
      let id = localStorage.getItem("mdb_visitor_id");
      if (!id) {
        id = "user_" + Math.random().toString(36).substring(2, 9);
        localStorage.setItem("mdb_visitor_id", id);
      }
      return id;
    }

    const myUserId = getVisitorId();
    let currentUsername = localStorage.getItem("mdb_username") || "";

    let editingMessageId = null;
    let deletingMessageId = null;

    // DOM Elements
    const usernameModal = document.getElementById("username-modal");
    const usernameInput = document.getElementById("username-input");
    const btnSaveUsername = document.getElementById("btn-save-username");
    
    const deleteModal = document.getElementById("delete-modal");
    const btnCancelDelete = document.getElementById("btn-cancel-delete");
    const btnConfirmDelete = document.getElementById("btn-confirm-delete");

    const editIndicator = document.getElementById("edit-indicator");
    const btnCancelEdit = document.getElementById("btn-cancel-edit");

    const messagesContainer = document.getElementById("messages-container");
    const messageInput = document.getElementById("message-input");
    const btnSend = document.getElementById("btn-send-message");
    const sendIcon = document.getElementById("send-icon");
    const emojiPanel = document.getElementById("emoji-panel");
    const stickerPanel = document.getElementById("sticker-panel");
    const btnToggleEmoji = document.getElementById("btn-toggle-emoji");
    const btnToggleSticker = document.getElementById("btn-toggle-sticker");
    const btnRecordAudio = document.getElementById("btn-record-audio");

    if (!currentUsername) usernameModal.style.display = "flex";

    btnSaveUsername.addEventListener("click", () => {
      const val = usernameInput.value.trim();
      if (val) {
        currentUsername = val;
        localStorage.setItem("mdb_username", currentUsername);
        usernameModal.style.display = "none";
      }
    });

    // Ecoute Firestore
    const q = query(collection(db, "chat_messages"), orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      messagesContainer.innerHTML = "";
      snapshot.forEach((docSnap) => {
        renderMessage({ id: docSnap.id, ...docSnap.data() });
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    function renderMessage(msg) {
      const isMine = msg.senderId === myUserId;
      const bubble = document.createElement("div");
      bubble.className = `message-bubble ${isMine ? 'mine' : 'other'}`;

      const formattedTime = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      let bodyContent = "";
      if (msg.type === "sticker") {
        bodyContent = `<img src="${msg.content}" class="sticker-img" alt="Sticker">`;
      } else if (msg.type === "audio") {
        bodyContent = `<audio controls src="${msg.content}"></audio>`;
      } else {
        bodyContent = `<div>${escapeHtml(msg.content)}</div>`;
      }

      bubble.innerHTML = `
        ${!isMine ? `<div class="msg-sender">${escapeHtml(msg.senderName || 'Anonyme')}</div>` : ''}
        ${bodyContent}
        <div class="msg-footer">
          ${msg.edited ? '<span class="edited-tag">modifié</span>' : ''}
          <span>${formattedTime}</span>
        </div>
      `;

      if (isMine) {
        const actionsDiv = document.createElement("div");
        actionsDiv.className = "msg-actions";

        if (msg.type === "text") {
          const editBtn = document.createElement("button");
          editBtn.className = "btn-action";
          editBtn.textContent = "✏️";
          editBtn.onclick = () => startEditMessage(msg.id, msg.content);
          actionsDiv.appendChild(editBtn);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn-action";
        deleteBtn.textContent = "🗑️";
        deleteBtn.onclick = () => openDeleteModal(msg.id);
        actionsDiv.appendChild(deleteBtn);

        bubble.appendChild(actionsDiv);
      }

      messagesContainer.appendChild(bubble);
    }

    function startEditMessage(msgId, content) {
      editingMessageId = msgId;
      messageInput.value = content;
      messageInput.focus();

      editIndicator.classList.add("active");
      sendIcon.innerHTML = `<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>`;
    }

    function cancelEdit() {
      editingMessageId = null;
      messageInput.value = "";
      editIndicator.classList.remove("active");
      sendIcon.innerHTML = `<path d="M2 21l21-9L2 3v7l15 2-15 2z"/>`;
    }

    btnCancelEdit.addEventListener("click", cancelEdit);

    function openDeleteModal(msgId) {
      deletingMessageId = msgId;
      deleteModal.style.display = "flex";
    }

    btnCancelDelete.addEventListener("click", () => {
      deletingMessageId = null;
      deleteModal.style.display = "none";
    });

    btnConfirmDelete.addEventListener("click", async () => {
      if (deletingMessageId) {
        try {
          await deleteDoc(doc(db, "chat_messages", deletingMessageId));
        } catch (e) {
          console.error("Erreur suppression :", e);
        } finally {
          deletingMessageId = null;
          deleteModal.style.display = "none";
        }
      }
    });

    async function handleSendOrUpdate() {
      const text = messageInput.value.trim();
      if (!text) return;

      try {
        if (editingMessageId) {
          await updateDoc(doc(db, "chat_messages", editingMessageId), {
            content: text,
            edited: true
          });
          cancelEdit();
        } else {
          await addDoc(collection(db, "chat_messages"), {
            senderId: myUserId,
            senderName: currentUsername || "Anonyme",
            content: text,
            type: "text",
            timestamp: serverTimestamp(),
            edited: false
          });
          messageInput.value = "";
        }
        emojiPanel.classList.remove("active");
        stickerPanel.classList.remove("active");
      } catch (e) {
        console.error("Erreur :", e);
      }
    }

    btnSend.addEventListener("click", handleSendOrUpdate);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSendOrUpdate();
    });

    btnToggleEmoji.addEventListener("click", () => {
      stickerPanel.classList.remove("active");
      emojiPanel.classList.toggle("active");
    });

    btnToggleSticker.addEventListener("click", () => {
      emojiPanel.classList.remove("active");
      stickerPanel.classList.toggle("active");
    });

    document.querySelectorAll(".emoji-item").forEach(item => {
      item.addEventListener("click", () => {
        messageInput.value += item.textContent;
      });
    });

    document.querySelectorAll(".sticker-item").forEach(item => {
      item.addEventListener("click", () => {
        const url = item.getAttribute("data-url");
        addDoc(collection(db, "chat_messages"), {
          senderId: myUserId,
          senderName: currentUsername || "Anonyme",
          content: url,
          type: "sticker",
          timestamp: serverTimestamp(),
          edited: false
        });
        stickerPanel.classList.remove("active");
      });
    });

    // Audio Recorder avec Firebase Storage
    let mediaRecorder, audioChunks = [], isRecording = false, audioStream = null;

    btnRecordAudio.addEventListener("click", async () => {
      if (!isRecording) {
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(audioStream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

          mediaRecorder.onstop = async () => {
            // Libération explicite du micro
            if (audioStream) {
              audioStream.getTracks().forEach(track => track.stop());
            }

            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const fileName = `audio_messages/${Date.now()}_${myUserId}.webm`;
            const audioRef = ref(storage, fileName);

            try {
              // Téléversement vers Firebase Storage
              const snapshot = await uploadBytes(audioRef, audioBlob);
              const downloadURL = await getDownloadURL(snapshot.ref);

              // Enregistrement de l'URL dans Firestore
              await addDoc(collection(db, "chat_messages"), {
                senderId: myUserId,
                senderName: currentUsername || "Anonyme",
                content: downloadURL,
                type: "audio",
                timestamp: serverTimestamp(),
                edited: false
              });
            } catch (error) {
              console.error("Erreur lors de l'envoi de l'audio :", error);
            }
          };

          mediaRecorder.start();
          isRecording = true;
          btnRecordAudio.classList.add("recording");
        } catch {
          alert("Accès au microphone refusé.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btnRecordAudio.classList.remove("recording");
      }
    });

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
